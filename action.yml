name: Render or publish Compose manifest
description: Render and optionally publish a Compose manifest to a central Git repository

inputs:
  operation:
    description: Operation to run, either render or publish
    required: false
    default: publish
  source:
    description: Path to the source or already-rendered Compose manifest
    required: false
    default: deploy/prod.yaml
  repo:
    description: Target repository as owner/name or a Git URL
    required: true
  branch:
    description: Target repository branch
    required: false
    default: main
  stack:
    description: Stack name; the default target is applications/<stack>.yaml
    required: true
  registry:
    description: Container registry used for rendered service images
    required: false
    default: ""
  tag:
    description: Release tag used for rendered service images
    required: false
    default: ""
  source-repository-url:
    description: Source repository URL
    required: false
    default: ${{ github.server_url }}/${{ github.repository }}
  source-revision:
    description: Source revision recorded in result provenance
    required: false
    default: ${{ github.sha }}
  target:
    description: Target path inside the repository; overrides the stack-derived path
    required: false
    default: ""
  mode:
    description: Publish mode, either merge or replace
    required: false
    default: merge
  message:
    description: Git commit message
    required: false
    default: ""
  token:
    description: Git token with write access to the target repository
    required: true
  git-user:
    description: Git commit author name
    required: false
    default: manifest-repo
  git-email:
    description: Git commit author email
    required: false
    default: manifest-repo@users.noreply.github.com
  validate-compose:
    description: Validate the target with docker compose config before committing
    required: false
    default: "true"
  template:
    description: Execute the whole source file as a strict Go template before YAML parsing
    required: false
    default: "false"
  rendered:
    description: Treat source as an already-rendered manifest and skip template and release rendering
    required: false
    default: "false"
  output:
    description: Workspace-relative path for the resulting rendered manifest
    required: false
    default: .manifest-repo/rendered.yaml

outputs:
  result:
    description: Versioned JSON result, suitable for fromJSON(...)
  changed:
    description: Whether the desired state has semantic changes
  rendered-manifest:
    description: Path to the resulting manifest
  revision:
    description: Current or newly published desired-state revision

runs:
  using: docker
  image: docker://ghcr.io/swarm-deploy/manifest-repo:v0
  env:
    MANIFEST_REPO_TOKEN: ${{ inputs.token }}
  args:
    - ${{ inputs.operation }}
    - --source
    - ${{ inputs.source }}
    - --repo
    - ${{ inputs.repo }}
    - --branch
    - ${{ inputs.branch }}
    - --stack
    - ${{ inputs.stack }}
    - --registry
    - ${{ inputs.registry }}
    - --tag
    - ${{ inputs.tag }}
    - --source-repository-url
    - ${{ inputs.source-repository-url }}
    - --source-revision
    - ${{ inputs.source-revision }}
    - --target
    - ${{ inputs.target }}
    - --mode
    - ${{ inputs.mode }}
    - --message
    - ${{ inputs.message }}
    - --git-user
    - ${{ inputs.git-user }}
    - --git-email
    - ${{ inputs.git-email }}
    - --validate-compose=${{ inputs.validate-compose }}
    - --template=${{ inputs.template }}
    - --rendered=${{ inputs.rendered }}
    - --output
    - ${{ inputs.output }}
    - --workspace
    - .
    - --token-env
    - MANIFEST_REPO_TOKEN

branding:
  icon: upload-cloud
  color: blue
