name: Render or publish Compose manifest
description: Render and optionally publish a Compose manifest to a central Git repository

inputs:
  operation:
    description: Operation to run, either render or publish
    required: false
    default: publish
  source:
    description: Path to the source or already-rendered Compose manifest
    required: false
    default: deploy/prod.yaml
  repo:
    description: Target repository as owner/name or a Git URL
    required: true
  branch:
    description: Target repository branch
    required: false
    default: main
  stack:
    description: Stack name; the default target is applications/<stack>.yaml
    required: true
  tag:
    description: Optional Go template variable available as {{ .Tag }} when template is enabled
    required: false
    default: ""
  source-repository-url:
    description: Source repository URL
    required: false
    default: ${{ github.server_url }}/${{ github.repository }}
  source-revision:
    description: Source revision recorded in result provenance
    required: false
    default: ${{ github.sha }}
  target:
    description: Target path inside the repository; overrides the stack-derived path
    required: false
    default: ""
  mode:
    description: Publish mode, either merge or replace
    required: false
    default: merge
  message:
    description: Git commit message
    required: false
    default: ""
  token:
    description: Git token with write access to the target repository
    required: true
  git-user:
    description: Git commit author name
    required: false
    default: manifest-repo
  git-email:
    description: Git commit author email
    required: false
    default: manifest-repo@users.noreply.github.com
  validate-compose:
    description: Validate the target with docker compose config before committing
    required: false
    default: "true"
  template:
    description: Execute the whole source file as a strict Go template before YAML parsing
    required: false
    default: "false"
  rendered:
    description: Treat source as an already-rendered manifest and skip template and repository label rendering
    required: false
    default: "false"
  output:
    description: Workspace-relative path for the resulting rendered manifest
    required: false
    default: .manifest-repo/rendered.yaml

outputs:
  result:
    description: Versioned JSON result, suitable for fromJSON(...)
    value: ${{ steps.manifest.outputs.result }}
  changed:
    description: Whether the desired state has semantic changes
    value: ${{ steps.manifest.outputs.changed }}
  rendered-manifest:
    description: Path to the resulting manifest
    value: ${{ steps.manifest.outputs.rendered-manifest }}
  revision:
    description: Current or newly published desired-state revision
    value: ${{ steps.manifest.outputs.revision }}

runs:
  using: composite
  steps:
    - name: Prepare output directory
      shell: bash
      env:
        MANIFEST_REPO_OUTPUT: ${{ inputs.output }}
      run: mkdir -p -- "$(dirname -- "$MANIFEST_REPO_OUTPUT")"

    - name: Run manifest-repo
      id: manifest
      shell: bash
      env:
        INPUT_OPERATION: ${{ inputs.operation }}
        INPUT_SOURCE: ${{ inputs.source }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_STACK: ${{ inputs.stack }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_SOURCE_REPOSITORY_URL: ${{ inputs.source-repository-url }}
        INPUT_SOURCE_REVISION: ${{ inputs.source-revision }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_MESSAGE: ${{ inputs.message }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_GIT_USER: ${{ inputs.git-user }}
        INPUT_GIT_EMAIL: ${{ inputs.git-email }}
        INPUT_VALIDATE_COMPOSE: ${{ inputs.validate-compose }}
        INPUT_TEMPLATE: ${{ inputs.template }}
        INPUT_RENDERED: ${{ inputs.rendered }}
        INPUT_OUTPUT: ${{ inputs.output }}
      run: |
        docker run --rm \
          --volume "$GITHUB_WORKSPACE:/github/workspace" \
          --volume "$(dirname "$GITHUB_OUTPUT"):$(dirname "$GITHUB_OUTPUT")" \
          --workdir /github/workspace \
          --env "GITHUB_OUTPUT=$GITHUB_OUTPUT" \
          --env "MANIFEST_REPO_TOKEN=$INPUT_TOKEN" \
          ghcr.io/swarm-deploy/manifest-repo:v0 \
          "$INPUT_OPERATION" \
          --source "$INPUT_SOURCE" \
          --repo "$INPUT_REPO" \
          --branch "$INPUT_BRANCH" \
          --stack "$INPUT_STACK" \
          --tag "$INPUT_TAG" \
          --source-repository-url "$INPUT_SOURCE_REPOSITORY_URL" \
          --source-revision "$INPUT_SOURCE_REVISION" \
          --target "$INPUT_TARGET" \
          --mode "$INPUT_MODE" \
          --message "$INPUT_MESSAGE" \
          --git-user "$INPUT_GIT_USER" \
          --git-email "$INPUT_GIT_EMAIL" \
          "--validate-compose=$INPUT_VALIDATE_COMPOSE" \
          "--template=$INPUT_TEMPLATE" \
          "--rendered=$INPUT_RENDERED" \
          --output "$INPUT_OUTPUT" \
          --workspace . \
          --token-env MANIFEST_REPO_TOKEN

branding:
  icon: upload-cloud
  color: blue
